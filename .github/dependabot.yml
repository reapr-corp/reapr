version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Dependency bumps need no changeset; the changeset check honours this label.
    labels: [dependencies, no-changeset]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, no-changeset]
    ignore:
      # Its tags carry a `cargo-` prefix that dependabot misorders (it proposed a downgrade); bump by hand.
      - dependency-name: bruits/sampo
  - package-ecosystem: npm
    # The mutation-audit skill's eval fixture pins its versions on purpose (reproducible evals).
    directory: /plugins/reapr/skills/mutation-audit/evals/files/fixture/base
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
