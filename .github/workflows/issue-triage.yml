name: Issue triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  area-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label the area from the bug form's Component field
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/### Component\s+([^\n]+)/);
            if (!match) return;
            const areas = {
              'CLI (rpr)': 'area:cli',
              'GitHub Action (reapr-corp/run)': 'area:action',
              'Agent skill (/reapr:mutation-audit)': 'area:skill',
            };
            const label = areas[match[1].trim()];
            if (!label) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });
