name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt and clippy).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      # The StrykerJS plan step tests run plan.mjs (Node >= 20.10) with the minimatch bundled in npm.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Dogfood: Reapr gates its own pull requests with the cargo-mutants adapter, on the PR's diff only.
  mutation:
    name: mutation (rpr + cargo-mutants)
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch's history, for `origin/<base>...HEAD`.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Prebuilt, checksum-verified binary. Keep the version inside SUPPORTED_VERSIONS
      # (crates/reapr-cargo-mutants/src/lib.rs).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: cargo-mutants adapter end-to-end test
        run: cargo test -p reapr-cargo-mutants --test e2e -- --ignored
      - run: cargo build -p rpr
      - name: rpr run on this pull request's diff
        env:
          BASE_REF: ${{ github.base_ref }}
          # Below the full-run baseline (86.2% on main, cargo-mutants 27.1.0); raised as survivors are killed.
          MIN_SCORE: "80"
          # Reapr's own CI is not usage.
          DO_NOT_TRACK: "1"
        run: ./target/debug/rpr run --diff "origin/$BASE_REF" --engine cargo-mutants --min-score "$MIN_SCORE"
