[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/reapr-corp/reapr"

[workspace.dependencies]
reapr-core = { path = "crates/reapr-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
libc = "0.2.191"
dunce = "1.0.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
