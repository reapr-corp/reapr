[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Release runs are started by workflow_dispatch (from .github/workflows/sampo.yml) instead of a tag push:
# a tag pushed with GITHUB_TOKEN does not trigger workflows.
dispatch-releases = true

# Build on Blacksmith: native x86_64 and ARM runners (no cross-compilation); plan/host/announce on 2 vCPU.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "blacksmith-4vcpu-ubuntu-2404"
aarch64-unknown-linux-gnu = "blacksmith-4vcpu-ubuntu-2404-arm"
global = "blacksmith-2vcpu-ubuntu-2404"
