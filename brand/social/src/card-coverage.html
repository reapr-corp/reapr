<!doctype html>
<html data-size="1200x630"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .rows { position: absolute; left: 88px; right: 88px; top: 72px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 30px 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .ask { font-size: 26px; margin-bottom: 14px; }
  .q { font-size: 50px; }
  .n { font-size: 64px; font-weight: 500; text-align: right; }
  .n small { display: block; font-size: 22px; font-weight: 400; margin-top: 8px; }
  .foot { position: absolute; left: 88px; right: 88px; bottom: 64px; display: flex; justify-content: space-between; align-items: center; }
  .foot .lockup { height: 44px; }
  .foot .mono { font-size: 20px; }
</style></head>
<body style="width:1200px;height:630px">
  <div class="rows">
    <div class="row">
      <div><div class="ask muted">Coverage asks</div><div class="q h">Did this line run?</div></div>
      <div class="n mono">100%<small class="muted">lines</small></div>
    </div>
    <div class="row">
      <div><div class="ask muted">Mutation score asks</div><div class="q h">Would a test fail<br>if it changed?</div></div>
      <div class="n mono">83.33%<small><span class="survived">1 survived</span></small></div>
    </div>
  </div>
  <div class="foot"><div class="lockup"></div><div class="mono muted">Same file. Same two tests.</div></div>
</body></html>
